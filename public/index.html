<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- Базовые мета-теги -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Всегда под рукой" />
    
    <!-- Стандартная иконка для вкладок браузера -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- Для современных браузеров (предпочтительный формат) -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/logoK.svg" />
    <!-- Альтернатива для старых браузеров -->
    <link rel="alternate icon" type="image/png" href="%PUBLIC_URL%/logoK180.png" />
    
    <!-- Иконки для iOS (добавление на домашний экран) -->
    <!-- Рекомендуется использовать PNG 180x180 пикселей -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logoK180.png" />
    <!-- Для разных размеров экранов iOS (рекомендуется добавить) -->
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/logoK152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/logoK180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="%PUBLIC_URL%/logoK167.png" />
    
    <!-- Настройки при добавлении на домашний экран iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KAZOKU STAFF" />
    
    <!-- Open Graph / Facebook (для соц. сетей) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://isin-lab.github.io/kazoku-staff" />
    <meta property="og:title" content="KAZOKU STAFF" />
    <meta property="og:description" content="Всегда под рукой" />
    <meta property="og:image" content="https://isin-lab.github.io/kazoku-staff/logoK180.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter Card (если нужно) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://isin-lab.github.io/kazoku-staff" />
    <meta name="twitter:title" content="KAZOKU STAFF" />
    <meta name="twitter:description" content="Всегда под рукой" />
    <meta name="twitter:image" content="https://isin-lab.github.io/kazoku-staff/logoK180.png" />
    
    <!-- Manifest для PWA (рекомендуется добавить) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
